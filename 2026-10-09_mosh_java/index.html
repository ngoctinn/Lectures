<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khóa học Java Toàn diện cho Người mới bắt đầu — Ghi chú & Video Đồng bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #f59e0b;
      --badge-bg: #0369a1;
      --code-bg: #090d16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #090d16;
      border-bottom: 1px solid var(--panel-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .badge {
      background: var(--badge-bg);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1.course-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .meta-tags {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .search-box {
      position: relative;
      width: 320px;
    }
    .search-box input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    /* Main layout */
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(480px, 1.25fr) minmax(400px, 1fr);
      min-height: 0;
      overflow: hidden;
    }

    /* Left pane: Video & Current playing */
    .video-section {
      background: #000;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--panel-border);
      min-height: 0;
    }
    .video-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .video-bar {
      background: var(--panel);
      border-top: 1px solid var(--panel-border);
      padding: 0.75rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }
    .playing-info {
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .time-indicator {
      color: var(--accent);
      font-family: 'Fira Code', monospace;
      font-weight: 600;
    }

    /* Right pane: Course Curriculum & Slides */
    .notes-section {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .section-header {
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      padding: 0.75rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .section-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .curriculum-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    /* Chapter card */
    .chapter-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 1rem;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .chapter-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }
    .chapter-card.active {
      border-color: var(--primary);
      background: #1e3a5f;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
    }
    .card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.35rem;
    }
    .chapter-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: #fff;
    }
    .chapter-timestamp {
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .chapter-en {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
      font-style: italic;
    }
    .chapter-desc {
      font-size: 0.86rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    /* Slide gallery inside card */
    .slide-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }
    .slide-thumb {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      aspect-ratio: 16/9;
      background: #000;
    }
    .slide-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .slide-thumb:hover img {
      transform: scale(1.08);
    }

    /* Lightbox Modal for slides */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal.open { display: flex; }
    .modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 1px solid var(--panel-border);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    @media (max-width: 900px) {
      .main-container { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    }
  </style>
</head>

  <div class="main-container">

rt_str": "43:39", "end_str": "50:42", "title": "Chuỗi ký tự (Strings)", "title_en": "Strings", "desc": "Tính bất biến (immutability) của String, các hàm hữu ích: length(), replace(), toLowerCase(), indexOf().", "frames": ["frame_0090.jpg", "frame_0093.jpg", "frame_0096.jpg", "frame_0098.jpg"]}, {"id": 14, "start": 3042, "end": 3202, "start_str": "50:42", "end_str": "53:22", "title": "Ký tự thoát (Escape Sequences)", "title_en": "Escape Sequences", "desc": "Sử dụng dấu gạch chéo ngược: \\n (xuống dòng), \\t (tab), \\\" (ngoặc kép), \\\\ (dấu gạch chéo).", "frames": ["frame_0105.jpg", "frame_0110.jpg"]}, {"id": 15, "start": 3202, "end": 3527, "start_str": "53:22", "end_str": "58:47", "title": "Mảng (Arrays)", "title_en": "Arrays", "desc": "Khai báo mảng 1 chiều, kích thước cố định, sử dụng Arrays.toString() và Arrays.sort().", "frames": ["frame_0111.jpg", "frame_0112.jpg", "frame_0113.jpg", "frame_0114.jpg"]}, {"id": 16, "start": 3527, "end": 3683, "start_str": "58:47", "end_str": "1:01:23", "title": "Mảng đa chiều (Multi-Dimensional Arrays)", "title_en": "Multi-Dimensional Arrays", "desc": "Khởi tạo ma trận 2D, 3D và hiển thị bằng Arrays.deepToString().", "frames": ["frame_0120.jpg", "frame_0121.jpg"]}, {"id": 17, "start": 3683, "end": 3795, "start_str": "1:01:23", "end_str": "1:03:15", "title": "Hằng số (Constants)", "title_en": "Constants", "desc": "Sử dụng từ khóa final để cố định giá trị biến, quy ước đặt tên VIẾT_HOA.", "frames": ["frame_0125.jpg", "frame_0126.jpg", "frame_0127.jpg"]}, {"id": 18, "start": 3795, "end": 4038, "start_str": "1:03:15", "end_str": "1:07:18", "title": "Biểu thức số học (Arithmetic Expressions)", "title_en": "Arithmetic Expressions", "desc": "Phép cộng, trừ, nhân, chia, chia lấy dư (%), toán tử tăng giảm ++x và x++.", "frames": ["frame_0128.jpg", "frame_0133.jpg", "frame_0146.jpg"]}, {"id": 19, "start": 4038, "end": 4120, "start_str": "1:07:18", "end_str": "1:08:40", "title": "Thứ tự ưu tiên toán tử (Order of Operations)", "title_en": " 32, "start_str": "2:15:36", "end_str": "2:18:52", "title": "Lệnh Break và Continue", "title_en": "Break and Continue", "desc": "break để thoát vòng lặp ngay lập tức, continue để bỏ qua lần lặp hiện tại sang lần tiếp theo.", "frames": []}, {"id": 39, "start": 8332, "end": 8519, "start_str": "2:18:52", "end_str": "2:21:59", "title": "Vòng lặp For-Each", "title_en": "For-Each Loop", "desc": "Cách duyệt nhanh các phần tử trong mảng hoặc danh sách cực kỳ trực quan và sạch sẽ.", "frames": ["frame_0284.jpg"]}, {"id": 40, "start": 8519, "end": 8607, "start_str": "2:21:59", "end_str": "2:23:27", "title": "Dự án: Mortgage Calculator (v2 - Yêu cầu)", "title_en": "Project: Mortgage Calculator (v2)", "desc": "Nâng cấp dự án: Bổ sung vòng lặp kiểm tra tính hợp lệ của dữ liệu nhập (Input Validation).", "frames": ["frame_0286.jpg", "frame_0287.jpg"]}, {"id": 41, "start": 8607, "end": 8908, "start_str": "2:23:27", "end_str": "2:28:28", "title": "Dự án: Giải pháp Mortgage Calculator (v2)", "title_en": "Solution: Mortgage Calculator (v2)", "desc": "Hoàn thiện mã nguồn với vòng lặp while(true) và thông báo lỗi nếu nhập ngoài khoảng cho phép.", "frames": ["frame_0288.jpg", "frame_0289.jpg", "frame_0290.jpg", "frame_0291.jpg"]}, {"id": 42, "start": 8908, "end": 8965, "start_str": "2:28:28", "end_str": "2:29:25", "title": "Tóm tắt chương Điều khiển luồng", "title_en": "Control Flow Summary", "desc": "Tổng kết kiến thức về điều kiện logic, rẽ nhánh và các loại vòng lặp trong Java.", "frames": ["frame_0299.jpg"]}, {"id": 43, "start": 8965, "end": 9048, "start_str": "2:29:25", "end_str": "2:30:48", "title": "Nguyên tắc viết code sạch (Clean Coding)", "title_en": "Clean Coding", "desc": "Quy tắc đặt tên biến rõ nghĩa, tránh magic numbers, giữ hàm ngắn gọn và định dạng code chuẩn.", "frames": ["frame_0300.jpg", "frame_0301.jpg", "frame_0302.jpg"]}];
    const player = document.getElementById('mainPlayer');
    const timeDisplay = document.getElementById('timeDisplay');
    const currentChapterName = document.getElementById('currentChapterName');
    const listContainer = document.getElementById('curriculumList');
    const searchInput = document.getElementById('searchInput');
    const imageModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function renderChapters(items) {
      listContainer.innerHTML = '';
      items.forEach(c => {
        const card = document.createElement('div');
        card.className = 'chapter-card';
        card.id = 'chapter-' + c.id;
        card.dataset.start = c.start;
        card.dataset.end = c.end;

        let slidesHtml = '';
        if (c.frames && c.frames.length > 0) {
          slidesHtml = '<div class="slide-gallery">' +
            c.frames.map(f => `<div class="slide-thumb" onclick="event.stopPropagation(); openImage('slides/${f}')"><img src="slides/${f}" alt="Slide" loading="lazy"></div>`).join('') +
            '</div>';
        }

        card.innerHTML = `
          <div class="card-top">
            <span class="chapter-title">${c.id < 10 ? '0' + c.id : c.id}. ${c.title}</span>
            <span class="chapter-timestamp">${c.start_str}</span>
          </div>
          <div class="chapter-en">${c.title_en}</div>
          <div class="chapter-desc">${c.desc}</div>
          ${slidesHtml}
        `;

        card.addEventListener('click', () => {
          player.currentTime = c.start;
          player.play();
        });

        listContainer.appendChild(card);
      });
    }

    function openImage(src) {
      modalImg.src = src;
      imageModal.classList.add('open');
    }

    // Initial render
    renderChapters(chapters);

    // Sync playback with chapter highlighting
    player.addEventListener('timeupdate', () => {
      const curr = player.currentTime;
      timeDisplay.textContent = formatTime(curr);

      const active = chapters.find(c => curr >= c.start && curr <= c.end);
      if (active) {
        currentChapterName.textContent = (active.id < 10 ? '0' + active.id : active.id) + '. ' + active.title;
        document.querySelectorAll('.chapter-card').forEach(card => card.classList.remove('active'));
        const activeCard = document.getElementById('chapter-' + active.id);
        if (activeCard) {
          activeCard.classList.add('active');
        }
      }
    });

    // Search filter
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = chapters.filter(c => 
        c.title.toLowerCase().includes(term) ||
        c.title_en.toLowerCase().includes(term) ||
        c.desc.toLowerCase().includes(term)
      );
      renderChapters(filtered);
    });
  </script>
